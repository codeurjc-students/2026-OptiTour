openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:443
  description: Generated server url
paths:
  /tour/all:
    get:
      tags:
      - tour-controller
      operationId: getTours
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TourDTO"
components:
  schemas:
    TourDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
